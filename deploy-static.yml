---
# deploy-static.yml
# CMSForNerd2 Ansible Static Orchestration Playbook
# Optimised for dual-pathway execution: Limited Sandbox Environments vs. Real OS

- name: CMSForNerd2 Static Site Deployment
  hosts: all
  connection: local
  gather_facts: yes
  vars:
    # Default variables
    build_dir: "{{ playbook_dir }}/dist"
    src_dir: "{{ playbook_dir }}"
    nginx_web_root: "/var/www/cmsfornerd2"

  tasks:
    - name: 🔍 Detect limited or Google Jules sandbox environment
      set_fact:
        is_limited_environment: "{{ ansible_env.USER == 'jules' or ansible_env.JULES_ENV is defined or (ansible_virtualization_type is defined and ansible_virtualization_type in ['docker', 'container', 'lxc']) }}"

    - name: 📋 Display detected environment status
      debug:
        msg: >
          Detected environment is {% if is_limited_environment %}LIMITED/SANDBOX (e.g., Google Jules){% else %}REAL OS{% endif %}.
          User: {{ ansible_env.USER }}. Virtualization Type: {{ ansible_virtualization_type | default('unknown') }}.

    # ==========================================
    # PATHWAY A: Real OS Only (Unrestricted Actions)
    # ==========================================
    - name: 🧱 [Real OS Only] Install system-wide dependencies
      apt:
        name:
          - nginx
          - git
          - curl
        state: present
        update_cache: yes
      become: yes
      when: not is_limited_environment
      tags: foundation

    - name: 🧱 [Real OS Only] Apply Nginx system hardening configurations
      copy:
        src: "{{ src_dir }}/nginx/nginx.conf"
        dest: "/etc/nginx/nginx.conf"
        owner: root
        group: root
        mode: '0644'
      become: yes
      when: not is_limited_environment
      tags: webserver

    - name: 🧱 [Real OS Only] Create production deployment web root
      file:
        path: "{{ nginx_web_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
      become: yes
      when: not is_limited_environment
      tags: webserver

    - name: 🧱 [Real OS Only] Configure firewall (allow HTTP/HTTPS)
      ufw:
        rule: allow
        name: 'Nginx Full'
      become: yes
      when: not is_limited_environment
      tags: foundation

    - name: 🧱 [Real OS Only] Reload systemd and Nginx daemon
      systemd:
        name: nginx
        state: reloaded
        daemon_reload: yes
      become: yes
      when: not is_limited_environment
      tags: webserver

    # ==========================================
    # PATHWAY B: Dual Support Actions (Conditional execution)
    # ==========================================
    - name: 📦 [Dual] Install workspace local npm packages
      command: npm install --legacy-peer-deps
      args:
        chdir: "{{ src_dir }}"
      tags: compilation

    - name: 🏗️ [Dual] Compile Astro static site (SSG build)
      command: npm run build
      args:
        chdir: "{{ src_dir }}"
      tags: compilation

    - name: 🚀 [Real OS] Deploy static assets to production web root
      synchronize:
        src: "{{ build_dir }}/"
        dest: "{{ nginx_web_root }}/"
        delete: yes
      become: yes
      when: not is_limited_environment
      tags: deployment

    - name: 🚀 [Limited Sandbox] Mock deployment task for Jules/ephemeral VM
      debug:
        msg: >
          Successfully completed compilation in limited sandbox environment.
          Static assets have been verified and built in local '{{ build_dir }}' directory.
          Bypassed persistent system-level deployment since we are in a limited sandbox.
      when: is_limited_environment
      tags: deployment
