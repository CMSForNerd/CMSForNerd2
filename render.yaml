services:
  - type: web
    name: cmsfornerd2
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: TZ
        value: Asia/Kuala_Lumpur

  - type: static
    name: cmsfornerd2-static
    buildCommand: npm run build
    publishPath: dist
