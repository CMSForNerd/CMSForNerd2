services:
  - type: web
    name: cmsfornerd2
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: TZ
        value: Asia/Kuala_Lumpur

  - type: static
    name: cmsfornerd2-static
    buildCommand: npm run build
    publishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*; connect-src 'self' https://* wss://*; worker-src 'self' blob:;"
      - path: /pagefind/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
